<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
</head>
<body class="theme-focus">
  <main class="app-container">
    <div class="timer-card">
      <!-- Header / Mode Tab Selector -->
      <nav class="mode-tabs" role="tablist" aria-label="Timer Modes">
        <button 
          type="button" 
          role="tab" 
          id="tab-focus" 
          class="tab-btn active" 
          data-mode="focus" 
          aria-selected="true">
          Focus
        </button>
        <button 
          type="button" 
          role="tab" 
          id="tab-short" 
          class="tab-btn" 
          data-mode="shortBreak" 
          aria-selected="false">
          Short Break
        </button>
        <button 
          type="button" 
          role="tab" 
          id="tab-long" 
          class="tab-btn" 
          data-mode="longBreak" 
          aria-selected="false">
          Long Break
        </button>
      </nav>

      <!-- Circular Timer Display -->
      <div class="clock-wrapper">
        <svg class="progress-ring" viewBox="0 0 320 320" aria-hidden="true">
          <circle 
            class="progress-ring-track" 
            cx="160" 
            cy="160" 
            r="140" 
            fill="none" 
            stroke-width="12" 
          />
          <circle 
            class="progress-ring-fill" 
            id="progress-circle"
            cx="160" 
            cy="160" 
            r="140" 
            fill="none" 
            stroke-width="12" 
            stroke-linecap="round"
          />
        </svg>

        <div class="timer-content">
          <span class="mode-indicator" id="mode-indicator">Focus Time</span>
          <div class="time-display" id="time-display" aria-live="polite" aria-atomic="true">25:00</div>
          <span class="session-caption" id="session-caption">Ready to focus</span>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="controls-container">
        <button type="button" class="ctrl-btn btn-start" id="btn-start" aria-label="Start timer">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M8 5.14v14l11-7-11-7z"/>
          </svg>
          <span>Start</span>
        </button>

        <button type="button" class="ctrl-btn btn-pause" id="btn-pause" aria-label="Pause timer" disabled>
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <span>Pause</span>
        </button>

        <button type="button" class="ctrl-btn btn-reset" id="btn-reset" aria-label="Reset timer">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span>Reset</span>
        </button>
      </div>

      <!-- Footer Sound Notification Toggle -->
      <div class="card-footer">
        <button type="button" class="sound-toggle" id="btn-sound-toggle" aria-label="Toggle chime sound" title="Toggle chime notification sound">
          <svg class="icon sound-on" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="icon sound-off hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
          <span class="sound-label">Chime on</span>
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
